# Puerto y dominio del servidor virtual
server {
    listen 80;                          # Puerto interno del contenedor (no exponer al host)
    server_name _;                      # Acepta cualquier dominio (NPM filtra antes)
    root /usr/share/nginx/html;         # Ruta de los archivos estáticos (dist/ copiado aquí)
    index index.html;                   # Fichero por defecto al acceder a /

    # SPA fallback — todas las rutas devuelven index.html
    # Sin esto, refrescar en /try-it daría 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos — 1 año
    # Los archivos JS/CSS llevan hash en el nombre (index-CHKmCcWh.js),
    # así que se pueden cachear agresivamente sin riesgo de versiones antiguas
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip — reduce el tamaño de las respuestas HTTP
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;                # Solo comprime si el body supera 256 bytes
}
